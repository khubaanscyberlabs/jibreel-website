<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jibreel Admin Orders</title>
  <link rel="stylesheet" href="style.css" />

  <style>
    body {
      background: #023048;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 30px;
    }

    .admin-box {
      max-width: 1200px;
      margin: auto;
      background: rgba(255,255,255,0.06);
      padding: 25px;
      border-radius: 16px;
      border: 1px solid rgba(212,175,55,0.35);
    }

    h1, h2 {
      color: #D4AF37;
      margin-bottom: 20px;
    }

    input, button, select {
      padding: 10px;
      border-radius: 8px;
      border: none;
      margin-bottom: 10px;
    }

    input {
      width: 300px;
    }

    button {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid transparent;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: #08A7C5;
      color: #023048;
    }

    .btn-primary:hover {
      background: #023048;
      color: #08A7C5;
    }

    .btn-danger {
      background: #fee2e2;
      color: #b91c1c;
    }

    .btn-danger:hover {
      background: #b91c1c;
      color: #fff;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #374151;
    }

    .btn-secondary:hover {
      background: #374151;
      color: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: #fff;
      color: #023048;
      border-radius: 12px;
      overflow: hidden;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      font-size: 14px;
      text-align: left;
    }

    th {
      background: #D4AF37;
      color: #023048;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      text-transform: lowercase;
      min-width: 70px;
      text-align: center;
    }

    .status-badge.created {
      background: #fff1d6;
      color: #c56b00;
    }

    .status-badge.paid {
      background: #dcfce7;
      color: #15803d;
    }

    .status-badge.packed {
      background: #fef3c7;
      color: #92400e;
    }

    .status-badge.shipped {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .status-badge.delivered {
      background: #d1fae5;
      color: #047857;
    }

    .status-badge.cancelled,
    .status-badge.failed,
    .status-badge.verification_failed {
      background: #fee2e2;
      color: #b91c1c;
    }
  </style>
</head>

<body>
  <div class="admin-box">
    <h1>Jibreel Admin Orders</h1>

    <div id="loginBox">
      <input type="text" id="adminUser" placeholder="Username" />
      <input type="password" id="adminPass" placeholder="Password" />
      <button class="btn-primary" onclick="adminLogin()">Login</button>
    </div>

    <div id="adminPanel" style="display:none;">
      <button class="btn-primary" onclick="loadOrders()">Load Orders</button>
      <button class="btn-primary" onclick="loadProducts()">Load Products</button>
      <button onclick="updateAllStatuses()" class="btn-secondary">Update All Statuses</button>
      <button onclick="clearOrders()" class="btn-danger">Clear All</button>
    </div>

    <p id="statusText">Login and click Load Orders.</p>

    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Order ID</th>
          <th>Customer</th>
          <th>Phone</th>
          <th>Payment ID</th>
          <th>Status</th>
          <th>Update</th>
          <th>Total</th>
          <th>Items</th>
        </tr>
      </thead>
      <tbody id="ordersBody"></tbody>
    </table>

    <h2>Manage Products</h2>

    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Price</th>
          <th>Discount</th>
          <th>Stock</th>
          <th>Save</th>
        </tr>
      </thead>
      <tbody id="productsBody"></tbody>
    </table>
  </div>

  <script>
    const BACKEND_URL = "https://name-jibreel-backend.onrender.com";
    const ADMIN_KEY = "JIBreel@1990";
    let isLoggedIn = false;

    async function adminLogin() {
      const username = document.getElementById("adminUser").value.trim();
      const password = document.getElementById("adminPass").value.trim();

      if (!username || !password) {
        alert("Enter username and password");
        return;
      }

      const response = await fetch(`${BACKEND_URL}/api/admin/login`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ username, password })
      });

      const data = await response.json();

      if (!data.success) {
        alert(data.message || "Login failed");
        return;
      }

      isLoggedIn = true;

      document.getElementById("loginBox").style.display = "none";
      document.getElementById("adminPanel").style.display = "block";

      alert("Login successful");
    }

    async function updateOrderStatus(orderId) {
      const selectedStatus = document.getElementById(`status-${orderId}`).value;

      const response = await fetch(`${BACKEND_URL}/api/admin/orders/${orderId}/status`, {
        method: "PATCH",
        headers: {
          "Content-Type": "application/json",
          "x-admin-key": ADMIN_KEY
        },
        body: JSON.stringify({ status: selectedStatus })
      });

      const data = await response.json();

      if (!data.success) {
        alert(data.message || "Status update failed.");
        return;
      }

      alert("Order status updated successfully.");
      loadOrders();
    }

    async function updateAllStatuses() {
      const selects = document.querySelectorAll("select[id^='status-']");

      if (selects.length === 0) {
        alert("No orders loaded.");
        return;
      }

      if (!confirm("Update all visible order statuses?")) return;

      for (const select of selects) {
        const orderId = select.id.replace("status-", "");
        const selectedStatus = select.value;

        await fetch(`${BACKEND_URL}/api/admin/orders/${orderId}/status`, {
          method: "PATCH",
          headers: {
            "Content-Type": "application/json",
            "x-admin-key": ADMIN_KEY
          },
          body: JSON.stringify({ status: selectedStatus })
        });
      }

      alert("All visible order statuses updated.");
      loadOrders();
    }

    async function clearOrders() {
      if (!confirm("Are you sure you want to delete ALL orders?")) return;

      try {
        const response = await fetch(`${BACKEND_URL}/api/admin/orders`, {
          method: "DELETE",
          headers: {
            "x-admin-key": ADMIN_KEY
          }
        });

        const data = await response.json();

        alert(data.message);

        if (data.success) {
          loadOrders();
        }

      } catch (error) {
        console.error(error);
        alert("Error clearing orders");
      }
    }

    async function deleteOrder(orderId) {
      if (!confirm("Delete this order?")) return;

      try {
        const res = await fetch(`${BACKEND_URL}/api/admin/orders/${orderId}`, {
          method: "DELETE",
          headers: {
            "x-admin-key": ADMIN_KEY
          }
        });

        const data = await res.json();

        alert(data.message);

        if (data.success) {
          loadOrders();
        }

      } catch (err) {
        console.error(err);
        alert("Delete failed");
      }
    }

    async function loadProducts() {
      const response = await fetch(`${BACKEND_URL}/api/products`);
      const data = await response.json();

      const productsBody = document.getElementById("productsBody");
      productsBody.innerHTML = "";

      if (!data.success) {
        alert(data.message || "Could not load products.");
        return;
      }

      data.products.forEach(p => {
        const row = document.createElement("tr");

        row.innerHTML = `
          <td>${p.name}</td>
          <td><input type="number" id="price-${p.id}" value="${p.price}" /></td>
          <td><input type="number" id="discount-${p.id}" value="${p.discount}" /></td>
          <td>
            <select id="stock-${p.id}">
              <option value="true" ${p.inStock ? "selected" : ""}>In Stock</option>
              <option value="false" ${!p.inStock ? "selected" : ""}>Out of Stock</option>
            </select>
          </td>
          <td>
            <button class="btn-primary" onclick="saveProduct('${p.id}')">Save</button>
          </td>
        `;

        productsBody.appendChild(row);
      });
    }

    async function saveProduct(productId) {
      const price = document.getElementById(`price-${productId}`).value;
      const discount = document.getElementById(`discount-${productId}`).value;
      const inStock = document.getElementById(`stock-${productId}`).value === "true";

      const response = await fetch(`${BACKEND_URL}/api/products`);
      const data = await response.json();

      const updatedProducts = data.products.map(p => {
        if (p.id === productId) {
          return {
            ...p,
            price: Number(price),
            discount: Number(discount),
            inStock
          };
        }
        return p;
      });

      const saveResponse = await fetch(`${BACKEND_URL}/api/admin/products`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "x-admin-key": ADMIN_KEY
        },
        body: JSON.stringify({ products: updatedProducts })
      });

      const saveData = await saveResponse.json();

      if (!saveData.success) {
        alert(saveData.message || "Product update failed");
        return;
      }

      alert("Product updated successfully");
      loadProducts();
    }

    async function loadOrders() {
      const statusText = document.getElementById("statusText");
      const ordersBody = document.getElementById("ordersBody");

      statusText.textContent = "Loading orders...";
      ordersBody.innerHTML = "";

      try {
        const response = await fetch(`${BACKEND_URL}/api/admin/orders`, {
          method: "GET",
          headers: {
            "x-admin-key": ADMIN_KEY
          }
        });

        const data = await response.json();

        if (!data.success) {
          statusText.textContent = data.message || "Could not load orders.";
          return;
        }

        statusText.textContent = `Total Orders: ${data.count}`;

        data.orders.forEach(order => {
          const items = Array.isArray(order.items)
            ? order.items.map(item => `${item.name || "Item"} x ${item.quantity || 1}`).join(", ")
            : "No items";

          const orderId = order.razorpayOrderId || order.orderId || order.id;

          const row = document.createElement("tr");

          row.innerHTML = `
            <td>${order.createdAt ? new Date(order.createdAt).toLocaleString() : "-"}</td>
            <td>${orderId || "-"}</td>
            <td>
              <strong>${order.customer?.name || "-"}</strong><br>
              <small>${order.customer?.address || "-"}</small>
            </td>
            <td>
              ${order.customer?.phone || "-"}<br>
              ${order.customer?.phone ? `<a href="https://wa.me/${order.customer.phone}" target="_blank">WhatsApp</a>` : ""}
            </td>
            <td>${order.payment?.razorpayPaymentId || "-"}</td>
            <td>
              <span class="status-badge ${order.status}">
                ${order.status || "-"}
              </span>
            </td>
            <td>
              <select id="status-${orderId}">
                <option value="created" ${order.status === "created" ? "selected" : ""}>Created</option>
                <option value="paid" ${order.status === "paid" ? "selected" : ""}>Paid</option>
                <option value="packed" ${order.status === "packed" ? "selected" : ""}>Packed</option>
                <option value="shipped" ${order.status === "shipped" ? "selected" : ""}>Shipped</option>
                <option value="delivered" ${order.status === "delivered" ? "selected" : ""}>Delivered</option>
                <option value="cancelled" ${order.status === "cancelled" ? "selected" : ""}>Cancelled</option>
              </select>
              <button class="btn-primary" onclick="updateOrderStatus('${orderId}')">Update</button>
            </td>
            <td>₹${order.amount || order.total || "-"}</td>
            <td>
              ${items}<br>
              <button class="btn-danger" onclick="deleteOrder('${orderId}')" style="margin-top:5px;">
                Delete
              </button>
            </td>
          `;

          ordersBody.appendChild(row);
        });

      } catch (error) {
        console.error(error);
        statusText.textContent = "Error connecting to backend.";
      }
    }
  </script>
</body>
</html>
