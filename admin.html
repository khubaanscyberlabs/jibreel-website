<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jibreel Admin Orders</title>
  <link rel="stylesheet" href="style.css" />

  <style>
    body {
      background: #023048;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 30px;
    }

    .admin-box {
      max-width: 1200px;
      margin: auto;
      background: rgba(255,255,255,0.06);
      padding: 25px;
      border-radius: 16px;
      border: 1px solid rgba(212,175,55,0.35);
    }

    h1 {
      color: #D4AF37;
      margin-bottom: 20px;
    }

    input, button {
      padding: 12px;
      border-radius: 8px;
      border: none;
      margin-bottom: 15px;
    }

    input {
      width: 300px;
    }

    button {
      background: #08A7C5;
      color: #023048;
      font-weight: bold;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: #fff;
      color: #023048;
      border-radius: 12px;
      overflow: hidden;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      font-size: 14px;
      text-align: left;
    }

    th {
      background: #D4AF37;
      color: #023048;
    }

    .paid {
      color: green;
      font-weight: bold;
    }

    .failed {
      color: red;
      font-weight: bold;
    }

    .created {
      color: orange;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="admin-box">
    <h1>Jibreel Admin Orders</h1>

    <input type="password" id="adminKey" placeholder="Enter Admin API Key" />
    <button onclick="loadOrders()">Load Orders</button>

    <p id="statusText">Enter admin key and click Load Orders.</p>

    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Order ID</th>
          <th>Payment ID</th>
          <th>Status</th>
          <th>Total</th>
          <th>Items</th>
        </tr>
      </thead>
      <tbody id="ordersBody">
      </tbody>
    </table>
  </div>

  <script>
    const BACKEND_URL = "https://name-jibreel-backend.onrender.com";

    async function loadOrders() {
      const adminKey = document.getElementById("adminKey").value.trim();
      const statusText = document.getElementById("statusText");
      const ordersBody = document.getElementById("ordersBody");

      if (!adminKey) {
        statusText.textContent = "Please enter admin key.";
        return;
      }

      statusText.textContent = "Loading orders...";
      ordersBody.innerHTML = "";

      try {
        const response = await fetch(`${BACKEND_URL}/api/admin/orders`, {
          method: "GET",
          headers: {
            "x-admin-key": adminKey
          }
        });

        const data = await response.json();

        if (!data.success) {
          statusText.textContent = data.message || "Could not load orders.";
          return;
        }

        statusText.textContent = `Total Orders: ${data.count}`;

        data.orders.forEach(order => {
          const items = Array.isArray(order.items)
            ? order.items.map(item => `${item.name || "Item"} x ${item.quantity || 1}`).join(", ")
            : "No items";

          const row = document.createElement("tr");

          row.innerHTML = `
            <td>${order.createdAt ? new Date(order.createdAt).toLocaleString() : "-"}</td>
            <td>${order.razorpayOrderId || order.orderId || "-"}</td>
            <td>${order.razorpayPaymentId || "-"}</td>
            <td class="${order.status || ""}">${order.status || "-"}</td>
            <td>₹${order.amount || order.total || "-"}</td>
            <td>${items}</td>
          `;

          ordersBody.appendChild(row);
        });

      } catch (error) {
        console.error(error);
        statusText.textContent = "Error connecting to backend.";
      }
    }
  </script>
</body>
</html>
