<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jibreel Admin Orders</title>
  <link rel="stylesheet" href="style.css" />

  <style>
    body {
      background: #023048;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 30px;
    }

    .admin-box {
      max-width: 1200px;
      margin: auto;
      background: rgba(255,255,255,0.06);
      padding: 25px;
      border-radius: 16px;
      border: 1px solid rgba(212,175,55,0.35);
    }

    h1, h2 {
      color: #D4AF37;
      margin-bottom: 20px;
    }

    input, button, select {
      padding: 10px;
      border-radius: 8px;
      border: none;
      margin-bottom: 10px;
    }

    input {
      width: 300px;
    }

    button {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid transparent;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: #08A7C5;
      color: #023048;
    }

    .btn-primary:hover {
      background: #023048;
      color: #08A7C5;
    }

    .btn-danger {
      background: #fee2e2;
      color: #b91c1c;
    }

    .btn-danger:hover {
      background: #b91c1c;
      color: #fff;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #374151;
    }

    .btn-secondary:hover {
      background: #374151;
      color: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: #fff;
      color: #023048;
      border-radius: 12px;
      overflow: hidden;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      font-size: 14px;
      text-align: left;
    }

    th {
      background: #D4AF37;
      color: #023048;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      text-transform: lowercase;
      min-width: 70px;
      text-align: center;
    }

    .status-badge.created {
      background: #fff1d6;
      color: #c56b00;
    }

    .status-badge.paid {
      background: #dcfce7;
      color: #15803d;
    }

    .status-badge.packed {
      background: #fef3c7;
      color: #92400e;
    }

    .status-badge.shipped {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .status-badge.delivered {
      background: #d1fae5;
      color: #047857;
    }

    .status-badge.cancelled,
    .status-badge.failed,
    .status-badge.verification_failed {
      background: #fee2e2;
      color: #b91c1c;
    }
  </style>
</head>

<body>
  <div class="admin-box">
    <h1>Jibreel Admin Orders</h1>

    <div id="loginBox">
      <input type="text" id="adminUser" placeholder="Username" />
      <input type="password" id="adminPass" placeholder="Password" />
      <button class="btn-primary" onclick="adminLogin()">Login</button>
    </div>

    <div id="adminPanel" style="display:none;">
  <label for="adminSection">Select Admin Section</label><br>

  <select id="adminSection" onchange="switchAdminSection()">
    <option value="">Choose section</option>
    <option value="orders">Orders Management</option>
    <option value="products">Product Management</option>
  </select>

  <div id="ordersActions" style="display:none; margin-top:15px;">
    <button class="btn-primary" onclick="loadOrders()">Refresh Orders</button>
    <button onclick="updateAllStatuses()" class="btn-secondary">Update All Statuses</button>
    <button onclick="clearOrders()" class="btn-danger">Clear All Orders</button>
  </div>

  <div id="productsActions" style="display:none; margin-top:15px;">
    <button class="btn-primary" onclick="loadProducts()">Refresh Products</button>
  </div>
</div>

    <p id="statusText">Login and click Load Orders.</p>

    <table id="ordersTable" style="display:none;">
      <thead>
        <tr>
          <th>Date</th>
          <th>Order ID</th>
          <th>Customer</th>
          <th>Phone</th>
          <th>Payment ID</th>
          <th>Status</th>
          <th>Update</th>
          <th>Total</th>
          <th>Items</th>
        </tr>
      </thead>
      <tbody id="ordersBody"></tbody>
    </table>

   <h2 id="productsTitle" style="display:none;">Manage Products</h2>

    <table id="productsTable" style="display:none;">
      <thead>
       <tr>
  <th>Name</th>
  <th>Status</th>
  <th>Stock</th>
  <th>Spray 30ml</th>
  <th>Spray 50ml</th>
  <th>Roll-on 6ml</th>
  <th>Roll-on 12ml</th>
  <th>Save</th>
</tr>
      </thead>
      <tbody id="productsBody"></tbody>
    </table>
  </div>

  <script>
    const BACKEND_URL = "https://name-jibreel-backend.onrender.com";
    const ADMIN_KEY = "JIBreel@1990";
    let isLoggedIn = false;

   function switchAdminSection() {

  const selected = document.getElementById("adminSection").value;

  const ordersActions = document.getElementById("ordersActions");
  const productsActions = document.getElementById("productsActions");

  const ordersTable = document.getElementById("ordersTable");
  const productsTable = document.getElementById("productsTable");
  const productsTitle = document.getElementById("productsTitle");
  const statusText = document.getElementById("statusText");

  // BUTTON AREAS
  if (ordersActions) {
    ordersActions.style.display =
      selected === "orders" ? "block" : "none";
  }

  if (productsActions) {
    productsActions.style.display =
      selected === "products" ? "block" : "none";
  }

  // TABLES
  if (ordersTable) {
    ordersTable.style.display =
      selected === "orders" ? "table" : "none";
  }

  if (productsTable) {
    productsTable.style.display =
      selected === "products" ? "table" : "none";
  }

  // PRODUCTS TITLE
  if (productsTitle) {
    productsTitle.style.display =
      selected === "products" ? "block" : "none";
  }

  // STATUS TEXT
  if (statusText) {
    statusText.style.display =
      selected === "orders" ? "block" : "none";
  }

  // LOAD DATA
  if (selected === "orders") {
    loadOrders();
  }

  if (selected === "products") {
    loadProducts();
  }

}

    async function adminLogin() {
      const username = document.getElementById("adminUser").value.trim();
      const password = document.getElementById("adminPass").value.trim();

      if (!username || !password) {
        alert("Enter username and password");
        return;
      }

      const response = await fetch(`${BACKEND_URL}/api/admin/login`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ username, password })
      });

      const data = await response.json();

      if (!data.success) {
        alert(data.message || "Login failed");
        return;
      }

      isLoggedIn = true;

      document.getElementById("loginBox").style.display = "none";
      document.getElementById("adminPanel").style.display = "block";

      alert("Login successful");
    }

    async function updateOrderStatus(orderId) {
      const selectedStatus = document.getElementById(`status-${orderId}`).value;

      const response = await fetch(`${BACKEND_URL}/api/admin/orders/${orderId}/status`, {
        method: "PATCH",
        headers: {
          "Content-Type": "application/json",
          "x-admin-key": ADMIN_KEY
        },
        body: JSON.stringify({ status: selectedStatus })
      });

      const data = await response.json();

      if (!data.success) {
        alert(data.message || "Status update failed.");
        return;
      }

      alert("Order status updated successfully.");
      loadOrders();
    }

    async function updateAllStatuses() {
      const selects = document.querySelectorAll("select[id^='status-']");

      if (selects.length === 0) {
        alert("No orders loaded.");
        return;
      }

      if (!confirm("Update all visible order statuses?")) return;

      for (const select of selects) {
        const orderId = select.id.replace("status-", "");
        const selectedStatus = select.value;

        await fetch(`${BACKEND_URL}/api/admin/orders/${orderId}/status`, {
          method: "PATCH",
          headers: {
            "Content-Type": "application/json",
            "x-admin-key": ADMIN_KEY
          },
          body: JSON.stringify({ status: selectedStatus })
        });
      }

      alert("All visible order statuses updated.");
      loadOrders();
    }

    async function clearOrders() {
      if (!confirm("Are you sure you want to delete ALL orders?")) return;

      try {
        const response = await fetch(`${BACKEND_URL}/api/admin/orders`, {
          method: "DELETE",
          headers: {
            "x-admin-key": ADMIN_KEY
          }
        });

        const data = await response.json();

        alert(data.message);

        if (data.success) {
          loadOrders();
        }

      } catch (error) {
        console.error(error);
        alert("Error clearing orders");
      }
    }

    async function deleteOrder(orderId) {
      if (!confirm("Delete this order?")) return;

      try {
        const res = await fetch(`${BACKEND_URL}/api/admin/orders/${orderId}`, {
          method: "DELETE",
          headers: {
            "x-admin-key": ADMIN_KEY
          }
        });

        const data = await res.json();

        alert(data.message);

        if (data.success) {
          loadOrders();
        }

      } catch (err) {
        console.error(err);
        alert("Delete failed");
      }
    }

    async function loadProducts() {

  const response = await fetch(`${BACKEND_URL}/api/products`);
  const data = await response.json();

  const productsBody = document.getElementById("productsBody");

  if (!productsBody) {
    console.error("productsBody not found");
    return;
  }

  productsBody.innerHTML = "";

  if (!data.success || !Array.isArray(data.products)) {
    alert("Failed to load products");
    return;
  }

  data.products.forEach(product => {

    const spray30 =
      product.variants?.spray?.sizes?.["30ml"] || "";

    const spray50 =
      product.variants?.spray?.sizes?.["50ml"] || "";

    const rollon6 =
      product.variants?.rollon?.sizes?.["6ml"] || "";

    const rollon12 =
      product.variants?.rollon?.sizes?.["12ml"] || "";

    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${product.name}</td>

      <td>
        <select id="status-${product.id}">
          <option value="active" ${product.status === "active" ? "selected" : ""}>Active</option>

          <option value="draft" ${product.status === "draft" ? "selected" : ""}>Draft</option>

          <option value="out_of_stock" ${product.status === "out_of_stock" ? "selected" : ""}>Out Of Stock</option>
        </select>
      </td>

      <td>
        <select id="stock-${product.id}">
          <option value="true" ${product.inStock !== false ? "selected" : ""}>In Stock</option>

          <option value="false" ${product.inStock === false ? "selected" : ""}>Out Of Stock</option>
        </select>
      </td>

      <td>
        <input type="number"
        id="spray30-${product.id}"
        value="${spray30}">
      </td>

      <td>
        <input type="number"
        id="spray50-${product.id}"
        value="${spray50}">
      </td>

      <td>
        <input type="number"
        id="rollon6-${product.id}"
        value="${rollon6}">
      </td>

      <td>
        <input type="number"
        id="rollon12-${product.id}"
        value="${rollon12}">
      </td>

      <td>
        <button onclick="saveProduct('${product.id}')">
          Save
        </button>
      </td>
    `;

    productsBody.appendChild(row);

  });

}

    
    async function saveProduct(productId) {
  const status = document.getElementById(`status-${productId}`).value;
  const inStock = document.getElementById(`stock-${productId}`).value === "true";

  const spray30 = Number(document.getElementById(`spray30-${productId}`).value);
  const spray50 = Number(document.getElementById(`spray50-${productId}`).value);
  const rollon6 = Number(document.getElementById(`rollon6-${productId}`).value);
  const rollon12 = Number(document.getElementById(`rollon12-${productId}`).value);

  const response = await fetch(`${BACKEND_URL}/api/products`);
  const data = await response.json();

  if (!data.success || !Array.isArray(data.products)) {
    alert("Could not fetch latest products.");
    return;
  }

  const updatedProducts = data.products.map(product => {
    if (product.id !== productId) return product;

    return {
      ...product,
      status,
      inStock,
      variants: {
        ...product.variants,
        spray: {
          ...product.variants?.spray,
          sizes: {
            ...product.variants?.spray?.sizes,
            "30ml": spray30,
            "50ml": spray50
          }
        },
        rollon: {
          ...product.variants?.rollon,
          sizes: {
            ...product.variants?.rollon?.sizes,
            "6ml": rollon6,
            "12ml": rollon12
          }
        }
      },
      updatedAt: new Date().toISOString()
    };
  });

  const saveResponse = await fetch(`${BACKEND_URL}/api/admin/products`, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json",
      "x-admin-key": ADMIN_KEY
    },
    body: JSON.stringify({ products: updatedProducts })
  });

  const saveData = await saveResponse.json();

  if (!saveData.success) {
    alert(saveData.message || "Product update failed");
    return;
  }

  alert("Product updated successfully");
  loadProducts();
}

    async function loadOrders() {
      const statusText = document.getElementById("statusText");
      const ordersBody = document.getElementById("ordersBody");

      statusText.textContent = "Loading orders...";
      ordersBody.innerHTML = "";

      try {
        const response = await fetch(`${BACKEND_URL}/api/admin/orders`, {
          method: "GET",
          headers: {
            "x-admin-key": ADMIN_KEY
          }
        });

        const data = await response.json();

        if (!data.success) {
          statusText.textContent = data.message || "Could not load orders.";
          return;
        }

        statusText.textContent = `Total Orders: ${data.count}`;

        data.orders.forEach(order => {
          const items = Array.isArray(order.items)
            ? order.items.map(item => `${item.name || "Item"} x ${item.quantity || 1}`).join(", ")
            : "No items";

          const orderId = order.razorpayOrderId || order.orderId || order.id;

          const row = document.createElement("tr");

          row.innerHTML = `
            <td>${order.createdAt ? new Date(order.createdAt).toLocaleString() : "-"}</td>
            <td>${orderId || "-"}</td>
            <td>
              <strong>${order.customer?.name || "-"}</strong><br>
              <small>${order.customer?.address || "-"}</small>
            </td>
            <td>
              ${order.customer?.phone || "-"}<br>
              ${order.customer?.phone ? `<a href="https://wa.me/${order.customer.phone}" target="_blank">WhatsApp</a>` : ""}
            </td>
            <td>${order.payment?.razorpayPaymentId || "-"}</td>
            <td>
              <span class="status-badge ${order.status}">
                ${order.status || "-"}
              </span>
            </td>
            <td>
              <select id="status-${orderId}">
                <option value="created" ${order.status === "created" ? "selected" : ""}>Created</option>
                <option value="paid" ${order.status === "paid" ? "selected" : ""}>Paid</option>
                <option value="packed" ${order.status === "packed" ? "selected" : ""}>Packed</option>
                <option value="shipped" ${order.status === "shipped" ? "selected" : ""}>Shipped</option>
                <option value="delivered" ${order.status === "delivered" ? "selected" : ""}>Delivered</option>
                <option value="cancelled" ${order.status === "cancelled" ? "selected" : ""}>Cancelled</option>
              </select>
              <button class="btn-primary" onclick="updateOrderStatus('${orderId}')">Update</button>
            </td>
            <td>₹${order.amount || order.total || "-"}</td>
            <td>
              ${items}<br>
              <button class="btn-danger" onclick="deleteOrder('${orderId}')" style="margin-top:5px;">
                Delete
              </button>
            </td>
          `;

          ordersBody.appendChild(row);
        });

      } catch (error) {
        console.error(error);
        statusText.textContent = "Error connecting to backend.";
      }
    }
  </script>
</body>
</html>
