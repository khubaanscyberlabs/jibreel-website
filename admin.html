<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jibreel Admin Orders</title>
  <link rel="stylesheet" href="style.css" />

  <style>
    body {
      background: #023048;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 30px;
    }

    .admin-box {
      max-width: 1200px;
      margin: auto;
      background: rgba(255,255,255,0.06);
      padding: 25px;
      border-radius: 16px;
      border: 1px solid rgba(212,175,55,0.35);
    }

    h1 {
      color: #D4AF37;
      margin-bottom: 20px;
    }

    input, button, select {
      padding: 10px;
      border-radius: 8px;
      border: none;
      margin-bottom: 10px;
    }

    input {
      width: 300px;
    }

    button {
  padding: 8px 14px;
  border-radius: 999px;
  border: 1px solid transparent;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
}

    .btn-primary {
  background: #08A7C5;
  color: #023048;
}

.btn-primary:hover {
  background: #023048;
  color: #08A7C5;
}

.btn-danger {
  background: #fee2e2;
  color: #b91c1c;
}

.btn-danger:hover {
  background: #b91c1c;
  color: #fff;
}

.btn-secondary {
  background: #e5e7eb;
  color: #374151;
}

.btn-secondary:hover {
  background: #374151;
  color: #fff;
}

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: #fff;
      color: #023048;
      border-radius: 12px;
      overflow: hidden;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      font-size: 14px;
      text-align: left;
    }

    th {
      background: #D4AF37;
      color: #023048;
    }

   .status-badge {
  display: inline-block;
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  text-transform: lowercase;
  min-width: 70px;
  text-align: center;
}

.status-badge.created {
  background: #fff1d6;
  color: #c56b00;
}

.status-badge.paid {
  background: #dcfce7;
  color: #15803d;
}

.status-badge.packed {
  background: #fef3c7;
  color: #92400e;
}

.status-badge.shipped {
  background: #dbeafe;
  color: #1d4ed8;
}

.status-badge.delivered {
  background: #d1fae5;
  color: #047857;
}

.status-badge.cancelled,
.status-badge.failed {
  background: #fee2e2;
  color: #b91c1c;
}  </style>
</head>

<body>
  <div class="admin-box">
    <h1>Jibreel Admin Orders</h1>

    <input type="password" id="adminKey" placeholder="Enter Admin API Key" />
    <button onclick="loadOrders()" class="btn-primary">Load Orders</button>
    <button onclick="updateAllStatuses()" class="btn-secondary">
  Update All Statuses
</button>
<button onclick="clearOrders()" class="btn-danger">Clear All</button>

    <p id="statusText">Enter admin key and click Load Orders.</p>

    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Order ID</th>
          <th>Customer</th>
          <th>Phone</th>
          <th>Payment ID</th>
          <th>Status</th>
          <th>Update</th>
          <th>Total</th>
          <th>Items</th>
        </tr>
      </thead>
      <tbody id="ordersBody"></tbody>
    </table>
  </div>

  <script>
    const BACKEND_URL = "https://name-jibreel-backend.onrender.com";

    async function updateOrderStatus(orderId) {
      const adminKey = document.getElementById("adminKey").value.trim();
      const selectedStatus = document.getElementById(`status-${orderId}`).value;

      if (!adminKey) {
        alert("Please enter admin key first.");
        return;
      }

      const response = await fetch(`${BACKEND_URL}/api/admin/orders/${orderId}/status`, {
        method: "PATCH",
        headers: {
          "Content-Type": "application/json",
          "x-admin-key": adminKey
        },
        body: JSON.stringify({ status: selectedStatus })
      });

      const data = await response.json();

      if (!data.success) {
        alert(data.message || "Status update failed.");
        return;
      }

      alert("Order status updated successfully.");
      loadOrders();
    }
    async function updateAllStatuses() {
  const adminKey = document.getElementById("adminKey").value.trim();

  if (!adminKey) {
    alert("Please enter admin key.");
    return;
  }

  const selects = document.querySelectorAll("select[id^='status-']");

  if (selects.length === 0) {
    alert("No orders loaded.");
    return;
  }
      if (!confirm("Update all visible order statuses?")) return;

  for (const select of selects) {
    const orderId = select.id.replace("status-", "");
    const selectedStatus = select.value;

    await fetch(`${BACKEND_URL}/api/admin/orders/${orderId}/status`, {
      method: "PATCH",
      headers: {
        "Content-Type": "application/json",
        "x-admin-key": adminKey
      },
      body: JSON.stringify({ status: selectedStatus })
    });
  }

  alert("All visible order statuses updated.");
  loadOrders();
}
async function clearOrders() {
  const adminKey = document.getElementById("adminKey").value.trim();

  if (!adminKey) {
    alert("Please enter admin key.");
    return;
  }

  if (!confirm("Are you sure you want to delete ALL orders?")) return;

  try {
    const response = await fetch(`${BACKEND_URL}/api/admin/orders`, {
      method: "DELETE",
      headers: {
        "x-admin-key": adminKey
      }
    });

    const data = await response.json();

    alert(data.message);

    if (data.success) {
      loadOrders();
    }

  } catch (error) {
    console.error(error);
    alert("Error clearing orders");
  }
}
    async function deleteOrder(orderId) {
  const adminKey = document.getElementById("adminKey").value.trim();

  if (!adminKey) {
    alert("Enter admin key");
    return;
  }

  if (!confirm("Delete this order?")) return;

  try {
    const res = await fetch(`${BACKEND_URL}/api/admin/orders/${orderId}`, {
      method: "DELETE",
      headers: {
        "x-admin-key": adminKey
      }
    });

    const data = await res.json();

    alert(data.message);

    if (data.success) {
      loadOrders();
    }

  } catch (err) {
    console.error(err);
    alert("Delete failed");
  }
}
    async function loadOrders() {
      const adminKey = document.getElementById("adminKey").value.trim();
      const statusText = document.getElementById("statusText");
      const ordersBody = document.getElementById("ordersBody");

      if (!adminKey) {
        statusText.textContent = "Please enter admin key.";
        return;
      }

      statusText.textContent = "Loading orders...";
      ordersBody.innerHTML = "";

      try {
        const response = await fetch(`${BACKEND_URL}/api/admin/orders`, {
          method: "GET",
          headers: {
            "x-admin-key": adminKey
          }
        });

        const data = await response.json();

        if (!data.success) {
          statusText.textContent = data.message || "Could not load orders.";
          return;
        }

        statusText.textContent = `Total Orders: ${data.count}`;

        data.orders.forEach(order => {
          const items = Array.isArray(order.items)
            ? order.items.map(item => `${item.name || "Item"} x ${item.quantity || 1}`).join(", ")
            : "No items";

          const orderId = order.razorpayOrderId || order.orderId || order.id;

          const row = document.createElement("tr");

       row.innerHTML = `
  <td>${order.createdAt ? new Date(order.createdAt).toLocaleString() : "-"}</td>
  <td>${orderId || "-"}</td>
  <td>
    <strong>${order.customer?.name || "-"}</strong><br>
    <small>${order.customer?.address || "-"}</small>
  </td>
  <td>
    ${order.customer?.phone || "-"}<br>
    ${order.customer?.phone ? `<a href="https://wa.me/${order.customer.phone}" target="_blank">WhatsApp</a>` : ""}
  </td>
  <td>${order.payment?.razorpayPaymentId || "-"}</td>
  <td>
    <span class="status-badge ${order.status}">
      ${order.status || "-"}
    </span>
  </td>
  <td>
    <select id="status-${orderId}">
      <option value="created" ${order.status === "created" ? "selected" : ""}>Created</option>
      <option value="paid" ${order.status === "paid" ? "selected" : ""}>Paid</option>
      <option value="packed" ${order.status === "packed" ? "selected" : ""}>Packed</option>
      <option value="shipped" ${order.status === "shipped" ? "selected" : ""}>Shipped</option>
      <option value="delivered" ${order.status === "delivered" ? "selected" : ""}>Delivered</option>
      <option value="cancelled" ${order.status === "cancelled" ? "selected" : ""}>Cancelled</option>
    </select>
    <button class="btn-primary" onclick="updateOrderStatus('${orderId}')">Update</button>
  </td>
  <td>₹${order.amount || order.total || "-"}</td>
  <td>
    ${items}<br>
    <button class="btn-danger" onclick="deleteOrder('${orderId}')" style="margin-top:5px;">
      Delete
    </button>
  </td>
`;

          ordersBody.appendChild(row);
        });

      } catch (error) {
        console.error(error);
        statusText.textContent = "Error connecting to backend.";
      }
    }
  </script>
</body>
</html>
